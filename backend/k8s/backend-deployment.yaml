apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: moai-backend:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: moai-env }
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/backend_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: DB_URL
              value: "jdbc:mysql://mysql-service:3306/backend_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort